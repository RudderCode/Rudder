<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rudder</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: transparent;
        color: light-dark(#152016, #edf5ed);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 12px;
      }

      main {
        position: relative;
        overflow: hidden;
        min-height: 220px;
        padding: 24px;
        border: 1px solid light-dark(#cbd8cb, #394739);
        border-radius: 18px;
        background:
          radial-gradient(
            circle at 100% 0%,
            light-dark(#dff5d9, #233d24) 0,
            transparent 48%
          ),
          light-dark(#f8fbf7, #172018);
        box-shadow: 0 12px 36px rgb(23 47 24 / 10%);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: light-dark(#274a29, #b8ddb9);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .mark {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: light-dark(#326b35, #75b979);
        color: #fff;
      }

      .status {
        padding: 5px 10px;
        border: 1px solid light-dark(#b8cdb9, #456147);
        border-radius: 999px;
        color: light-dark(#326b35, #9ed3a1);
        font-size: 12px;
        font-weight: 650;
      }

      section {
        max-width: 560px;
        padding-top: 40px;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 8vw, 48px);
        font-weight: 720;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .summary {
        margin: 16px 0 0;
        color: light-dark(#405441, #c2cec2);
        font-size: 17px;
        line-height: 1.55;
      }

      .fallback {
        margin: 24px 0 0;
        padding-top: 18px;
        border-top: 1px solid light-dark(#d8e2d7, #314032);
        color: light-dark(#617062, #9eaa9f);
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <span class="mark" aria-hidden="true">R</span>
          Rudder
        </div>
        <span class="status" id="status">Connecting</span>
      </header>
      <section>
        <h1 id="title">Rudder</h1>
        <p class="summary" id="summary">
          Turn coding-session intent into focused tests.
        </p>
        <p class="fallback" id="fallback">
          Use the Rudder skill to generate and verify tests for the current
          branch.
        </p>
      </section>
    </main>
    <script data-rudder-app></script>
  </body>
</html>
